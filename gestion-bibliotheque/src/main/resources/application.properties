spring.application.name=Gestion Bibliotheque
# Application
server.port=8080

# Active profile - loads application-local.properties
spring.profiles.active=local

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/bibliotheque
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver
logging.level.com.bibliotheque.gestion.service.BookImportService=DEBUG

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
# Security Configuration
app.security.max-login-attempts=5
app.security.account-lock-duration-minutes=30
app.security.reset-token-expiry-hours=24

# JWT
app.jwt.secret=${JWT_SECRET:your-secret-key-here}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# SendGrid Email Configuration
# Emails are sent using SendGrid API instead of SMTP

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS ( ajuster selon votre frontend)
cors.allowed-origins=http://localhost:5173,http://localhost:5175,http://localhost:4200
app.frontend.url=http://localhost:5175

# Security debug logging
logging.level.org.springframework.security=DEBUG
logging.level.com.bibliotheque.gestion.service.AuthService=DEBUG
logging.level.com.bibliotheque.gestion.security=DEBUG

SENDGRID_API_KEY=${SENDGRID_API_KEY:your-sendgrid-api-key}
SENDGRID_SENDER_EMAIL=${SENDGRID_SENDER_EMAIL:your-email@example.com}

# OpenRouter API Configuration for Chatbot
openrouter.api.key=${OPENROUTER_API_KEY:your-openrouter-api-key}
openrouter.api.url=https://openrouter.ai/api/v1/chat/completions
openrouter.model=openai/gpt-4o-mini-2024-07-18
